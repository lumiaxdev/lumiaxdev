name: Refresh public profile cards

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_profile.py
      - scripts/test_profile.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check public-data handling
        run: python3 scripts/test_profile.py
      - name: Render cards from public data
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_profile.py
      - name: Commit updated cards
        run: |
          git add assets/overview*.svg assets/activity*.svg assets/languages*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public GitHub profile cards'
          git push
